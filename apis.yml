name: Carrot
description: 'Carrot is a global fertility and family-building benefits platform that
  helps employers, health plans, benefits consultants, and labor unions offer inclusive
  reproductive care to their members. Carrot supports the full journey — preconception,
  IVF and IUI, egg, sperm, and embryo preservation, gestational surrogacy, adoption,
  pregnancy and postpartum care, men''s health, and hormonal and menopause support
  — across 175+ countries and 17,000+ providers. Products include Carrot Intelligence
  (an AI clinical platform), Carrot Rx medication sourcing, the Carrot Card payment
  solution, and Carrot Sprints metabolic-fertility programs. Backed by CRV; added
  to the API Evangelist network from VC portfolio enrichment.'
